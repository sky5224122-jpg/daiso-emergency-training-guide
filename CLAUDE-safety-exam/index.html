<!DOCTYPE html>
<html lang="ko" data-fs="m">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CLAUDE 산업안전지도사 문제은행</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="CLAUDE 산업안전지도사 1차(공통필수 3과목)·2차(기계·전기·건설) 기출 빈출 유형과 예상문제, 문항별 해설">
<meta name="theme-color" content="#1D5AA6">
<link rel="manifest" href="CLAUDE-manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fff'/%3E%3Crect x='3' y='3' width='58' height='58' rx='12' fill='none' stroke='%231E7A52' stroke-width='4'/%3E%3Cpath d='M26 14h12v12h12v12H38v12H26V38H14V26h12z' fill='%231E7A52'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="CLAUDE-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 한 열 모바일 앱 — 상단 고정 바 + 하단 탭 바, 본문은 최대 760px. 색은 KS 안전색(지시 청·안내 녹·금지 적·경고 황)을 상태 표시에 그대로 사용 */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#F6F8FA; --line:#DCE2E9; --line-2:#C5CED9;
  --ink:#14212E; --ink-2:#435365; --ink-3:#68778A;
  --sig-blue:#1D5AA6;   /* 지시 2.5PB 4/10 */
  --sig-green:#1E7A52;  /* 안내 2.5G 4/10 */
  --sig-red:#C2302A;    /* 금지 7.5R 4/14 */
  --sig-yellow:#F2C200; /* 경고 5Y 8.5/12 */
  --blue-soft:#E8EFF9; --green-soft:#E3F3EA; --red-soft:#FBEAE8; --yellow-soft:#FFF5D1;
  --on-sig:#FFFFFF; --on-yellow:#2B2300; --hero-bg:#163F73; --hero-ink:#FFFFFF; --hero-ink-2:#BFD2EC;
  --font:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r:14px; --r-sm:10px;
  --f-xs:12px; --f-sm:13px; --f-base:16px; --f-q:17px; --f-md:17px; --f-lg:19px; --f-xl:22px; --f-2xl:26px;
  --shadow:0 1px 2px rgba(20,33,46,.06),0 2px 8px rgba(20,33,46,.05);
}
html[data-fs="s"]{--f-xs:12px;--f-sm:13px;--f-base:15px;--f-q:16px;--f-md:16px;--f-lg:18px;--f-xl:20px;--f-2xl:24px}
html[data-fs="l"]{--f-xs:14px;--f-sm:15px;--f-base:18px;--f-q:19px;--f-md:19px;--f-lg:21px;--f-xl:24px;--f-2xl:28px}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D131B; --surface:#141C27; --surface-2:#1A2431; --line:#263345; --line-2:#344458;
    --ink:#E5EBF2; --ink-2:#A9B6C6; --ink-3:#8494A7;
    --sig-blue:#6FA6EE; --sig-green:#4FC48F; --sig-red:#FF8279; --sig-yellow:#F5CD3A;
    --blue-soft:#172A42; --green-soft:#12301F; --red-soft:#3A1A18; --yellow-soft:#3A3010;
    --on-sig:#0D131B; --on-yellow:#1F1900; --hero-bg:#112B4D; --hero-ink:#F1F5FA; --hero-ink-2:#9FB6D6;
    --shadow:0 1px 2px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D131B; --surface:#141C27; --surface-2:#1A2431; --line:#263345; --line-2:#344458;
  --ink:#E5EBF2; --ink-2:#A9B6C6; --ink-3:#8494A7;
  --sig-blue:#6FA6EE; --sig-green:#4FC48F; --sig-red:#FF8279; --sig-yellow:#F5CD3A;
  --blue-soft:#172A42; --green-soft:#12301F; --red-soft:#3A1A18; --yellow-soft:#3A3010;
  --on-sig:#0D131B; --on-yellow:#1F1900; --hero-bg:#112B4D; --hero-ink:#F1F5FA; --hero-ink-2:#9FB6D6;
  --shadow:0 1px 2px rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
body{overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--f-base);line-height:1.65;letter-spacing:-0.2px;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sig-blue);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.35;text-wrap:balance}
p{margin:0}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mark{width:32px;height:32px;border-radius:9px;border:2px solid var(--sig-green);display:grid;place-items:center;flex-shrink:0;background:var(--surface)}
.mark svg{width:18px;height:18px;fill:var(--sig-green)}
.brand{display:flex;flex-direction:column;line-height:1.25;min-width:0;flex:1}
.brand b{font-size:var(--f-md);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-size:var(--f-xs);color:var(--ink-3)}
.icon-btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;color:var(--ink-2)}

/* main */
main{max-width:760px;margin:0 auto;padding-block:16px 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.panel-h h2{font-size:var(--f-lg);font-weight:700}
.panel-h span{font-size:var(--f-sm);color:var(--ink-3)}
.eyebrow{font-size:var(--f-xs);font-weight:600;letter-spacing:.6px;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.small{font-size:var(--f-sm)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{appearance:none;background:none;border:0;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;font-size:var(--f-xs);font-weight:600;text-decoration:none}
.tab .ico{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--sig-blue)}

/* hero */
.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:var(--r);padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.hero .eyebrow{color:var(--hero-ink-2)}
.hero h1{font-size:var(--f-2xl);font-weight:700;letter-spacing:-0.6px}
.hero p{color:var(--hero-ink-2);font-size:var(--f-sm)}
.stages{display:grid;gap:8px}
.stage{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:var(--r-sm);padding:10px 12px}
.stage .no{font-family:var(--mono);font-weight:600;font-size:var(--f-sm);background:var(--hero-ink);color:var(--hero-bg);border-radius:6px;text-align:center;padding:2px 0}
.stage b{display:block;font-size:var(--f-base)}
.stage span{display:block;font-size:var(--f-sm);color:var(--hero-ink-2)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:var(--f-xs);color:var(--ink-3);font-weight:600}
.stat b{font-family:var(--mono);font-size:var(--f-xl);font-weight:600;font-variant-numeric:tabular-nums}
.stat small{font-size:var(--f-xs);color:var(--ink-3)}

/* actions */
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.action{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0;color:var(--ink)}
.action b{font-size:var(--f-base);font-weight:700}
.action span{font-size:var(--f-sm);color:var(--ink-3)}
.action .ico{color:var(--sig-blue);margin-bottom:2px}
.action.primary{background:var(--sig-blue);border-color:var(--sig-blue);color:var(--on-sig)}
.action.primary span,.action.primary .ico{color:var(--on-sig);opacity:.9}

/* buttons, chips */
.btn{appearance:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:12px 16px;font-weight:600;font-size:var(--f-base);display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px}
.btn.primary{background:var(--sig-blue);border-color:var(--sig-blue);color:var(--on-sig)}
.btn.danger{background:var(--sig-red);border-color:var(--sig-red);color:var(--on-sig)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.block{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lbl{font-size:var(--f-sm);font-weight:600;color:var(--ink-2);min-width:56px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:var(--f-sm);font-weight:600;color:var(--ink-2);min-height:34px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{appearance:none;border:0;background:transparent;border-radius:9px;padding:9px 4px;font-size:var(--f-sm);font-weight:600;color:var(--ink-3);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.toggle{display:flex;align-items:center;gap:10px;font-size:var(--f-sm);color:var(--ink-2)}
.toggle input{width:20px;height:20px;accent-color:var(--sig-blue)}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 8px;font-size:var(--f-xs);font-weight:700;line-height:1.6;white-space:nowrap}
.b-g{background:var(--yellow-soft);color:var(--ink)}
.b-g i{font-style:normal;letter-spacing:-1px;color:var(--ink-2)}
.b-e{background:var(--blue-soft);color:var(--sig-blue)}
.b-k{background:var(--ink);color:var(--surface)}
.knote{margin:10px 0 0;font-size:var(--f-xs);color:var(--ink-2);background:var(--surface-2);border:1px dashed var(--line-2);border-radius:8px;padding:8px 10px}
.b-s{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.b-ok{background:var(--green-soft);color:var(--sig-green)}
.b-ng{background:var(--red-soft);color:var(--sig-red)}

/* topic list */
.subj{display:flex;flex-direction:column;gap:6px}
.subj h3{font-size:var(--f-base);font-weight:700;display:flex;gap:8px;align-items:baseline}
.subj h3 small{font-weight:500;color:var(--ink-3);font-size:var(--f-xs)}
.tlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.trow{appearance:none;border:0;border-bottom:1px solid var(--line);background:var(--surface);display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;text-align:left;padding:10px 12px;color:var(--ink);min-width:0}
.trow:last-child{border-bottom:0}
.trow b{font-size:var(--f-sm);font-weight:600;min-width:0}
.trow .cnt{font-family:var(--mono);font-size:var(--f-xs);color:var(--ink-3);font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sig-green)}
.prog{display:flex;flex-direction:column;gap:10px}
.prog-row{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;font-size:var(--f-sm)}
.prog-row .bar{grid-column:auto;height:8px}
.prog-row .mono{font-size:var(--f-xs);color:var(--ink-3)}

/* list cards (2차, notes) */
.list{display:flex;flex-direction:column;gap:8px}
.card{appearance:none;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:12px 14px;display:flex;flex-direction:column;gap:6px;color:var(--ink);min-width:0}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card p{font-size:var(--f-sm);color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{border:1px dashed var(--line-2);border-radius:var(--r-sm);padding:18px;text-align:center;color:var(--ink-3);font-size:var(--f-sm)}

/* notice */
.notice{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;font-size:var(--f-sm);color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.notice b{color:var(--ink)}

/* overlay (quiz / detail) */
.overlay{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.ohead{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.ohead-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:56px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.ohead-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.ohead-t b{font-size:var(--f-base);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ohead-t small{font-size:var(--f-xs);color:var(--ink-3);font-family:var(--mono)}
.timer{font-family:var(--mono);font-weight:600;font-size:var(--f-base);padding:6px 10px;border-radius:8px;background:var(--blue-soft);color:var(--sig-blue);font-variant-numeric:tabular-nums}
.timer.warn{background:var(--sig-yellow);color:var(--on-yellow)}
.qprog{height:4px;background:var(--surface-2)}
.qprog i{display:block;height:100%;background:var(--sig-blue);transition:width .2s}
.obody{max-width:760px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.ofoot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.ofoot-in{max-width:760px;margin:0 auto;display:flex;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.ofoot-in .btn{flex:1}
.ofoot-in .btn.narrow{flex:0 0 auto}

.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.qmeta .qid{margin-left:auto;font-family:var(--mono);font-size:var(--f-xs);color:var(--ink-3)}
.qstem{font-size:var(--f-q);font-weight:600;line-height:1.6}
.qstem .qn{font-family:var(--mono);color:var(--sig-blue);margin-right:6px}
.qbox{border:1px solid var(--line-2);border-radius:var(--r-sm);padding:12px 14px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px;font-size:var(--f-base)}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.opt{appearance:none;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;font-size:var(--f-base);line-height:1.55;color:var(--ink);min-height:48px}
.opt .no{font-size:var(--f-md);color:var(--ink-3);font-weight:600;line-height:1.45}
.opt.sel{border-color:var(--sig-blue);background:var(--blue-soft)}
.opt.sel .no{color:var(--sig-blue)}
.opt.ok{border-color:var(--sig-green);background:var(--green-soft)}
.opt.ok .no{color:var(--sig-green)}
.opt.ng{border-color:var(--sig-red);background:var(--red-soft)}
.opt.ng .no{color:var(--sig-red)}
.opt:disabled{cursor:default}
.verdict{display:flex;align-items:center;gap:8px;border-radius:var(--r-sm);padding:10px 12px;font-weight:700;font-size:var(--f-base)}
.verdict.ok{background:var(--green-soft);color:var(--sig-green)}
.verdict.ng{background:var(--red-soft);color:var(--sig-red)}
.exp{scroll-margin-top:72px;border-top:1px dashed var(--line-2);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.exp h4,.gbox h4,.ans h4{font-size:var(--f-sm);font-weight:700;color:var(--ink-2);letter-spacing:.3px}
.rich{display:flex;flex-direction:column;gap:6px;font-size:var(--f-base)}
.rich ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.rich h4{font-size:var(--f-base);color:var(--ink);margin-top:6px}
.rich strong{color:var(--sig-blue);font-weight:700}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tbl table{border-collapse:collapse;width:100%;font-size:var(--f-sm)}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--surface-2);font-weight:700;white-space:nowrap}
.ref{font-size:var(--f-sm);color:var(--ink-3)}
.ref b{color:var(--ink-2)}
.gbox{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.gbox ul{margin:0;padding-left:18px;font-size:var(--f-sm);display:flex;flex-direction:column;gap:4px}
.term{appearance:none;border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline dotted var(--sig-blue);text-underline-offset:3px;cursor:help}

/* grid navigator */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.qgrid button{appearance:none;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;height:40px;font-family:var(--mono);font-size:var(--f-sm);color:var(--ink-2)}
.qgrid button.done{background:var(--blue-soft);border-color:var(--sig-blue);color:var(--sig-blue)}
.qgrid button.ok{background:var(--green-soft);border-color:var(--sig-green);color:var(--sig-green)}
.qgrid button.ng{background:var(--red-soft);border-color:var(--sig-red);color:var(--sig-red)}
.qgrid button.cur{outline:2px solid var(--ink);outline-offset:1px}

/* result */
.score{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0}
.score b{font-family:var(--mono);font-size:44px;font-weight:600;line-height:1.1}
.score span{font-size:var(--f-sm);color:var(--ink-3)}
.pass{font-size:var(--f-md);font-weight:700;border-radius:99px;padding:6px 16px}
.pass.ok{background:var(--sig-green);color:var(--on-sig)}
.pass.ng{background:var(--sig-red);color:var(--on-sig)}
.rtable{width:100%;border-collapse:collapse;font-size:var(--f-sm)}
.rtable th,.rtable td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.rtable td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}

/* 2차 */
.memo{width:100%;min-height:140px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:12px;background:var(--surface);resize:vertical;line-height:1.6;font-size:var(--f-base)}
.ans{scroll-margin-top:72px;border:1.5px solid var(--sig-green);border-radius:var(--r);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:10px}
.kw{display:flex;flex-direction:column;gap:6px}
.kw label{display:flex;gap:10px;align-items:flex-start;font-size:var(--f-sm);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.kw input{width:20px;height:20px;accent-color:var(--sig-green);flex-shrink:0;margin:1px 0 0}
.selfscore{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:var(--f-base);background:var(--green-soft);color:var(--sig-green);border-radius:8px;padding:10px 12px}
.setq{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px}
.setq h3{font-size:var(--f-base);font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* sheet & pop */
.sheet-back{position:fixed;inset:0;z-index:60;background:rgba(10,16,24,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{overscroll-behavior:contain;width:100%;max-width:760px;max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:var(--f-lg)}
.pop{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;width:min(560px,calc(100% - 32px));background:var(--ink);color:var(--surface);border-radius:12px;padding:12px 14px;font-size:var(--f-sm);line-height:1.55;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.pop b{color:var(--surface)}
.search{width:100%;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:12px 14px;background:var(--surface);font-size:var(--f-base)}
.gl{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.gl div{padding:10px 14px;border-bottom:1px solid var(--line);font-size:var(--f-sm)}
.gl div:last-child{border-bottom:0}
.gl b{font-size:var(--f-base)}

function filter1(){
  var f=S.f1;
  return QB1.filter(function(q){

    if(f.only){ var r=S.rec[q.id]; if(r && r.last===1) return false; }
    return true;
  });
}

var termQ='';
function glRows(q){
  q=String(q||'').trim().toLowerCase();
  var L=GL.map(function(g,i){return [g,i];}).filter(function(x){ var g=x[0]; if(!q) return true; return [g.k,g.p,g.m,g.u].concat(g.al||[]).join(' ').toLowerCase().indexOf(q)>=0; })
    .sort(function(a,b){ return a[0].k.toLowerCase()<b[0].k.toLowerCase()?-1:1; });
  if(!L.length) return '<div class="muted">검색 결과가 없습니다.</div>';

var curView='home';
function route(){
  var h=location.hash.replace('#','');
  if(OVK[h]){
    var ok=(h==='quiz'&&Q&&Q.mode!=='mock')||(h==='mock'&&Q&&Q.mode==='mock'&&S.mock&&!S.mock.done)||(h==='result'&&R)||(h==='q2'&&D2)||(h==='set2'&&SET2);
    if(!ok){ location.replace('#'+curView); return; }
    if(!OV) OV=h;
    renderOverlay(); return;
  }
  if(OV){ OV=null; stopTimer(); $('#overlay').innerHTML=''; document.body.style.overflow=''; }
  var v=VIEWS[h]?h:'home'; curView=v;
  $('#view').innerHTML=VIEWS[v]();
  document.querySelectorAll('.tab').forEach(function(t){ if(t.getAttribute('data-tab')===v) t.setAttribute('aria-current','page'); else t.removeAttribute('aria-current'); });
  window.scrollTo(0,0);
}
function rerender(){ if(OV) renderOverlay(); else $('#view').innerHTML=VIEWS[curView](); }
function pop(html){ var p=$('#pop'); p.innerHTML=html; p.hidden=false; clearTimeout(pop.t); pop.t=setTimeout(function(){ p.hidden=true; },6000); }

/* ═════════ EVENTS ═════════ */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]'); if(!t) { $('#pop').hidden=true; return; }
  var a=t.getAttribute('data-act'), d=t.dataset;
  if(a==='sheet-close'){ if(e.target.closest('[data-stop]') && t.classList.contains('sheet-back')) return; $('#sheet').innerHTML=''; return; }
  switch(a){
    case 'nav': location.hash=d.to; break;
    case 'settings': $('#sheet').innerHTML=settingsHTML(false); break;
    case 'set-fs': S.set.fs=d.v; save(); applySettings(); $('#sheet').innerHTML=settingsHTML(false); break;
    case 'set-theme': S.set.theme=d.v; save(); applySettings(); $('#sheet').innerHTML=settingsHTML(false); break;
    case 'reset': $('#sheet').innerHTML=settingsHTML(true); break;
    case 'reset-yes': var keep=S.set; S=blank(); S.set=keep; save(); $('#sheet').innerHTML=''; rerender(); pop('풀이 기록과 메모를 지웠습니다.'); break;
    case 'term': e.stopPropagation(); pop(fmtTerm(GL[+d.g])); break;
    case 'f1': S.f1[d.k]= d.k==='n' ? +d.v : d.v; save(); rerender(); break;
    case 'start1': { var pool=filter1(); var ids=pool.map(function(q){return q.id;}); if(S.f1.ord==='rand') ids=shuffle(ids); if(S.f1.n) ids=ids.slice(0,S.f1.n); var ttl='1차 '+(S.f1.s==='all'?'전 과목':SUBJ[S.f1.s].short)+(S.f1.t==='g'?' · 빈출 유형':S.f1.t==='e'?' · 예상':S.f1.t==='k'?' · 기출':''); startLearn(ids,ttl); break; }
    case 'topic': { var ids2=QB1.filter(function(q){ return q.s===d.s && q.tp===d.tp && (S.f1.t==='all'||q.t===S.f1.t); }).map(function(q){return q.id;}); startLearn(S.f1.ord==='rand'?shuffle(ids2):ids2, SUBJ[d.s].short+' · '+d.tp); break; }
    case 'today': { var w=shuffle(wrongList()), un=shuffle(QB1.filter(function(q){return !S.rec[q.id];})), rest=shuffle(QB1.filter(function(q){ var r=S.rec[q.id]; return r&&r.last===1; })); var pick=w.concat(un,rest).slice(0,20).map(function(q){return q.id;}); startLearn(shuffle(pick),'오늘의 20문제'); break; }
    case 'wrong-all': startLearn(shuffle(wrongList().map(function(q){return q.id;})),'오답 다시 풀기'); break;
    case 'bm-all': startLearn(S.bm.filter(function(id){return BY1[id];}),'북마크 문항'); break;
    case 'open1': startLearn([d.id],'문항 다시 보기'); break;
    case 'mock-open': location.hash='p1'; break;
    case 'mock-start': startMock(); break;
    case 'pwa-install': if(DEFERRED){ DEFERRED.prompt(); DEFERRED.userChoice.then(function(){ DEFERRED=null; rerender(); }); } break;
    case 'k-unlock': { var pw=($('#k-pass')||{}).value||''; var msg=$('#k-msg'); if(!pw){ if(msg) msg.textContent='암호를 입력하세요.'; break; } if(msg) msg.textContent='확인 중…'; unlockK(pw,function(ok,why){ if(ok){ location.reload(); } else if(msg) msg.textContent= why==='file' ? '잠금 파일을 불러오지 못했습니다. 인터넷 연결을 확인하세요.' : '암호가 맞지 않습니다.'; }); break; }
    case 'k-learn': startLearn(kIds(), K_RD+' 기출 1차'); break;
    case 'k-mock': startMock(kIds(), K_RD+' 기출 실전'); break;
    case 'set2-k': startSet2(true); break;
    case 'mock-resume': resumeMock(); break;
    case 'mock-quit': S.mock=null; save(); rerender(); break;
    case 'opt': { var q=BY1[Q.ids[Q.i]], k=+d.k;
      if(Q.mode==='learn'){ if(Q.ans[q.id]!=null) break; Q.ans[q.id]=k; record(q.id,k===q.a); renderOverlay(true); var ex=$('.exp'); if(ex) ex.scrollIntoView({block:'nearest',behavior:'smooth'}); }
      else if(Q.mode==='mock'){ Q.ans[q.id]=k; S.mock.ans=Q.ans; save(); renderOverlay(true); }
      break; }
    case 'qnext': if(Q.i<Q.ids.length-1){ Q.i++; if(Q.mode==='mock'){ S.mock.i=Q.i; save(); } renderOverlay(); } break;
    case 'qprev': if(Q.i>0){ Q.i--; if(Q.mode==='mock'){ S.mock.i=Q.i; save(); } renderOverlay(); } break;
    case 'qjump': Q.i=+d.i; Q.grid=false; if(Q.mode==='mock'){ S.mock.i=Q.i; save(); } renderOverlay(); break;
    case 'qgrid': Q.grid=!Q.grid; renderOverlay(); if(Q.grid){ var g=$('.qgrid'); if(g) g.scrollIntoView({block:'center'}); } break;
    case 'qbm': toggleBm(Q.ids[Q.i]); renderOverlay(true); break;
    case 'qclose': closeOverlay(Q.back); break;
    case 'qfinish': finishLearn(); break;
    case 'qsubmit': Q.confirm=true; renderOverlay(); break;
    case 'qsubmit-no': Q.confirm=false; renderOverlay(); break;
    case 'qsubmit-yes': Q.confirm=false; submitMock(); break;
    case 'qback-result': OV='result'; renderOverlay(); break;
    case 'res-close': closeOverlay(R.back); break;
    case 'res-review': Q={mode:'review',ids:R.ids,i:0,ans:R.ans,title:R.title.replace(' 결과','')+' 해설',back:R.back}; OV='quiz'; renderOverlay(); break;
    case 'res-jump': Q={mode:'review',ids:R.ids,i:+d.i,ans:R.ans,title:R.title.replace(' 결과','')+' 해설',back:R.back}; OV='quiz'; renderOverlay(); break;
    case 'res-wrong': { var wids=R.ids.filter(function(id){ return R.ans[id]!==BY1[id].a; }); Q={mode:'learn',ids:shuffle(wids),i:0,ans:{},title:'틀린 문항 다시 풀기',back:R.back}; OV='quiz'; renderOverlay(); break; }
    case 'f2': S.f2[d.k]=d.v; save(); rerender(); break;
    case 'nt': S.nt=d.v; save(); rerender(); break;
    case 'open2': { var ids3=list2ids(d.list); var i3=ids3.indexOf(d.id); D2={ids:ids3.length?ids3:[d.id],i:i3<0?0:i3,show:{},back:curView}; openOverlay('q2'); break; }
    case 'reveal2': if(OV==='q2'){ D2.show[d.id]=true; renderOverlay(true); var an=$('.ans'); if(an) an.scrollIntoView({block:'start',behavior:'smooth'}); } break;
    case 'q2prev': if(D2.i>0){ D2.i--; renderOverlay(); } break;
    case 'q2next': if(D2.i<D2.ids.length-1){ D2.i++; renderOverlay(); } break;
    case 'q2bm': toggleBm(D2.ids[D2.i]); renderOverlay(true); break;
    case 'q2close': closeOverlay(D2.back); break;
    case 'set2-start': startSet2(); break;
    case 'set2grade': SET2.graded=true; stopTimer(); renderOverlay(); break;
    case 'set2close': closeOverlay('p2'); break;
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='only-new'){ S.f1.only=t.checked; save(); rerender(); return; }
  if(t.hasAttribute('data-kw')){ var id=t.getAttribute('data-kw'), i=+t.getAttribute('data-i'); S.kw[id]=S.kw[id]||{}; S.kw[id][i]=t.checked; save();
    var q=BY2[id], sc=kwScore(q), el=$('#ss-'+id); if(el) el.lastChild.textContent=sc.c+'/'+sc.n+' 키워드 · 약 '+sc.pt+' / '+q.pt+'점';
    if(OV==='set2'&&SET2&&SET2.graded){ renderOverlay(true); } }
});
var memoT=null;
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='term-q'){ termQ=t.value; var g=$('#gl'); if(g) g.innerHTML=glRows(termQ); return; }
  if(t.hasAttribute('data-memo')){ var id=t.getAttribute('data-memo'); S.memo[id]=t.value; clearTimeout(memoT); memoT=setTimeout(save,400); }
});
window.addEventListener('hashchange',route);

applySettings();
if(S.mock && !S.mock.done && S.mock.end<Date.now()){ S.mock.done=true; save(); }
route();

/* 홈 화면 추가(오프라인)용 — GitHub Pages에서만 등록 */
try{ if('serviceWorker' in navigator && /github\.io$|^localhost$|^127\./.test(location.hostname)){ navigator.serviceWorker.register('CLAUDE-sw.js').catch(function(){}); } }catch(e){}
})();
</script>
